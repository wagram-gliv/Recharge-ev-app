<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recharge EV Planner MVP</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
      integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
      crossorigin=""
    />
  </head>
  <body>
    <main class="container">
      <h1>Prochain point de recharge rapide</h1>
      <p class="subtitle">MVP: recommandations en mode sécurisé (15%) et avancé (5%).</p>

      <form id="planner-form" novalidate>
        <div class="grid">
          <label>Capacité batterie (kWh)
            <input type="number" id="batteryCapacity" min="1" step="0.1" required />
          </label>
          <label>État de charge actuel (%)
            <input type="number" id="soc" min="0" max="100" step="0.1" required />
          </label>
          <label>Consommation moyenne (kWh/100km)
            <input type="number" id="consumption" min="0.1" step="0.1" required />
          </label>
          <label>Origine
            <input type="text" id="origin" placeholder="Paris" required />
          </label>
          <label>Destination
            <input type="text" id="destination" placeholder="Lyon" required />
          </label>
        </div>
        <button type="submit">Calculer mon prochain point de recharge</button>
      </form>

      <section id="messages"></section>
      <section id="results" class="results hidden"></section>
      <div id="map" class="hidden"></div>
    </main>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
